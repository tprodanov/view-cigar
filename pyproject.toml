[build-system]
requires = ["setuptools >= 75"]
build-backend = "setuptools.build_meta"

[project]
name = "view-cigar"
version = "0.1.0"
dependencies = [
    "pysam>=0.22",
    "colored>=2.2",
]
requires-python = ">=3.10"
authors = [
  {name = "Timofey Prodanov"},
]
maintainers = [
  {name = "Timofey Prodanov"},
]
description = "Easily visualize alignment"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["alignment", "cigar"]

[project.urls]
Repository = "https://github.com/tprodanov/view-cigar"
"Bug Tracker" = "https://github.com/tprodanov/view-cigar/issues"

[project.scripts]
view-cigar = "view_cigar.view_cigar:main"